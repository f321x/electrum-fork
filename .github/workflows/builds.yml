name: builds

on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC daily
  workflow_dispatch:
    inputs:
      target:
        description: 'Which build(s) to run'
        required: true
        default: 'all'
        type: choice
        options: [all, windows, android, appimage, tarball, macos]
      android_arch:
        description: 'Android architecture (when running android)'
        required: false
        default: 'arm64-v8a'
        type: choice
        options: [arm64-v8a, armeabi-v7a, x86_64]

permissions:
  contents: read

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: false   # never kill a nightly or in-progress build

env:
  ARTIFACT_RETENTION: '14'

jobs:
  windows:
    name: "build: Windows"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0    # for git describe / version detection

      - name: Cache Wine pip
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: contrib/build-wine/.cache/win*/wine_pip_cache
          key: wine-pip-${{ hashFiles('contrib/deterministic-build/*.txt', 'contrib/build-wine/**') }}

      - name: Cache Wine native lib builds (libsecp256k1, libusb, zxing-cpp)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: contrib/build-wine/.cache/win*/build
          key: wine-build-${{ hashFiles('contrib/make_libsecp256k1.sh', 'contrib/make_libusb.sh', 'contrib/make_zxing.sh', 'contrib/build-wine/**') }}

      - name: Build Windows binaries
        run: ./contrib/build-wine/build.sh

      - name: List output
        run: ls -lah contrib/build-wine/dist/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: electrum-windows-${{ github.sha }}
          path: contrib/build-wine/dist/*
          retention-days: ${{ env.ARTIFACT_RETENTION }}
          if-no-files-found: error
          compression-level: 0

  android:
    name: "build: Android (${{ inputs.android_arch || 'arm64-v8a' }})"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      APK_ARCH: ${{ inputs.android_arch || 'arm64-v8a' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      # GitHub guarantees 14 GB of free space, but we can delete some things for more space.
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/microsoft \
            /opt/pipx
          sudo docker image prune --all --force || true
          df -h

      - name: Cache python packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: packages
          key: android-packages-${{ env.APK_ARCH }}-${{ hashFiles('contrib/deterministic-build/**', 'contrib/make_packages.sh', 'contrib/android/**', '!contrib/android/.cache') }}

      - name: Cache buildozer (p4a)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            .buildozer_qml/android/platform/build-${{ env.APK_ARCH }}/packages
            .buildozer_qml/android/platform/build-${{ env.APK_ARCH }}/build
          key: android-buildozer-${{ env.APK_ARCH }}-${{ hashFiles('contrib/android/**', '!contrib/android/.cache') }}

      - name: Build APK (debug)
        run: ./contrib/android/build.sh qml "$APK_ARCH" debug

      - name: List output
        run: ls -lah dist/

      - name: Upload Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: electrum-android-${{ env.APK_ARCH }}-${{ github.sha }}
          path: dist/*
          retention-days: ${{ env.ARTIFACT_RETENTION }}
          if-no-files-found: error
          compression-level: 0

  appimage:
    name: "build: AppImage"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'appimage' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Cache AppImage pip
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: contrib/build-linux/appimage/.cache/pip_cache
          key: appimage-pip-${{ hashFiles('contrib/deterministic-build/*.txt', 'contrib/build-linux/appimage/**') }}

      - name: Cache AppImage build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: contrib/build-linux/appimage/.cache/appimage
          key: appimage-build-${{ hashFiles('contrib/make_libsecp256k1.sh', 'contrib/make_zxing.sh', 'contrib/build-linux/appimage/**') }}

      - name: Build AppImage
        run: ./contrib/build-linux/appimage/build.sh

      - name: List output
        run: ls -lah dist/

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: electrum-appimage-${{ github.sha }}
          path: dist/*.AppImage
          retention-days: ${{ env.ARTIFACT_RETENTION }}
          if-no-files-found: error
          compression-level: 0

  tarball:
    name: "build: tarball (${{ matrix.variant }})"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'tarball' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            omit_unclean: '0'
            artifact_name: electrum-tarball
          - variant: source-only
            omit_unclean: '1'
            artifact_name: electrum-sourceonly-tarball
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Build source tarball (${{ matrix.variant }})
        env:
          OMIT_UNCLEAN_FILES: ${{ matrix.omit_unclean }}
        run: ./contrib/build-linux/sdist/build.sh

      - name: List output
        run: ls -lah dist/

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: dist/*.tar.gz
          retention-days: ${{ env.ARTIFACT_RETENTION }}
          if-no-files-found: error
          compression-level: 0

  macos:
    name: "build: macOS"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos' }}
    # Same macOS and Command Line Tools as the builder VM (contrib/osx/README.md), so the app hashes at
    # the end of the build log should match the builders' (the DMG files are not reproducible).
    # make_osx.sh fails if GitHub changes the Command Line Tools. GitHub retires this image in fall 2027.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0    # for git describe / version detection

      # make_osx.sh needs the builders' path. And clang searches /usr/local/{include,lib}, where
      # the image has Homebrew's headers and libraries.
      - name: Set up like a builder VM
        run: |
          sudo mkdir -p /Users/vagrant
          sudo chown "$(id -u):$(id -g)" /Users/vagrant
          umask 022  # file modes are part of the app
          git clone --no-local "$GITHUB_WORKSPACE" /Users/vagrant/electrum
          for d in /usr/local/include /usr/local/lib; do
            if [ -e "$d" ]; then sudo mv "$d" "$d.hidden"; fi
          done

      - name: Build macOS binaries
        working-directory: /Users/vagrant/electrum
        run: ./contrib/osx/make_osx.sh

      - name: List output
        run: ls -lah /Users/vagrant/electrum/dist/

      - name: Upload macOS DMGs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: electrum-macos-${{ github.sha }}
          path: /Users/vagrant/electrum/dist/*.dmg
          retention-days: ${{ env.ARTIFACT_RETENTION }}
          if-no-files-found: error
          compression-level: 0

  macos-smoke:
    name: "smoke test: macOS ${{ matrix.arch }} on ${{ matrix.runner }}"
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15-intel, arch: x86_64}
          - {runner: macos-15, arch: arm64}
          - {runner: macos-26, arch: arm64}
          - {runner: macos-26, arch: x86_64}  # under Rosetta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout entitlements.plist
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          sparse-checkout: contrib/osx/entitlements.plist
          sparse-checkout-cone-mode: false

      - name: Download macOS DMGs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: electrum-macos-${{ github.sha }}
          path: dmg

      - name: Mount the DMG
        run: |
          mkdir -p "$RUNNER_TEMP/mnt"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/mnt" dmg/electrum-*-${{ matrix.arch }}-unsigned.dmg
          echo "APP=$RUNNER_TEMP/mnt/Electrum.app" >> "$GITHUB_ENV"

      # PyInstaller signs every binary and the app ad hoc.
      - name: Verify the signatures
        run: codesign --verify --deep --strict "$APP"

      # Release apps run with the hardened runtime and contrib/osx/entitlements.plist (sign_osx.sh),
      # which restricts what the process may do. Test a copy signed the same way, but ad hoc.
      - name: Sign a copy like a release
        run: |
          ditto "$APP" "$RUNNER_TEMP/Electrum.app"
          codesign -f --deep -s - --entitlements=contrib/osx/entitlements.plist -o runtime "$RUNNER_TEMP/Electrum.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/Electrum.app"
          echo "APP=$RUNNER_TEMP/Electrum.app" >> "$GITHUB_ENV"

      # Loads Python, Qt, QtMultimedia, cryptography and the native libraries (libsecp256k1,
      # zxing-cpp, libusb), and checks the process architecture: on an arm64 runner, an x86_64
      # process runs under Rosetta.
      - name: Run the app's version_info command
        run: |
          "$APP/Contents/MacOS/run_electrum" --offline -v -D "$RUNNER_TEMP/data" version_info > version_info.json 2> version_info.log \
            || { cat version_info.log; exit 1; }
          cat version_info.json version_info.log
          grep -q 'On platform: macOS-[0-9.]*-${{ matrix.arch }}-' version_info.log \
            || { echo "The process is not ${{ matrix.arch }}."; exit 1; }
          grep -q 'successfully preloaded optional dependency: PyQt6.QtMultimedia' version_info.log \
            || { echo "QtMultimedia did not load."; exit 1; }
          python3 - "$APP" <<'PY'
          import json, os, sys
          info = json.load(open("version_info.json"))
          app = os.path.realpath(sys.argv[1]) + "/"
          bad = [k for k in ["qt.version", "cryptography.version"] if not info.get(k)]
          # (the loaders fall back to system-wide libraries)
          libs = ["libsecp256k1.path", "libZXing.path", "libusb.path"]
          bad += [k for k in libs if not os.path.realpath(info.get(k) or "/").startswith(app)]
          sys.exit(f"not loaded from the app: {bad}" if bad else 0)
          PY

      # Opens the first-run wizard, which then waits for input. Fails if the app exits, the wizard does
      # not open, or the app logs an error (Electrum's crash reporter catches exceptions, so the app
      # keeps running).
      - name: Start the GUI
        run: |
          "$APP/Contents/MacOS/run_electrum" --offline -v -D "$RUNNER_TEMP/gui" > gui.log 2>&1 &
          pid=$!
          for i in $(seq 90); do  # a first start under Rosetta takes about 20 s
            if grep -q load_next_component gui.log || ! kill -0 "$pid" 2> /dev/null; then break; fi
            sleep 1
          done
          sleep 5  # time for errors while the first page is built
          alive=yes
          kill "$pid" 2> /dev/null || alive=no
          wait "$pid" 2> /dev/null || true
          echo "== log without debug lines:"
          { grep -v -F ' | D | ' gui.log || true; } | tail -n 40
          if [ "$alive" = no ]; then echo "The GUI exited."; exit 1; fi
          if ! grep -q load_next_component gui.log; then echo "The wizard did not open."; exit 1; fi
          if grep -F -e ' | E | ' -e ' | C | ' gui.log; then echo "The GUI logged errors."; exit 1; fi
